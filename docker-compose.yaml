services:
  smartcam:
    build: .
    container_name: smartcam
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3100}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMARTCAM_API_KEY=${SMARTCAM_API_KEY}
      - APP_URL=${APP_URL:-}
    env_file:
      - .env